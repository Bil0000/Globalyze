name: Globalyze

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Auto-fix project
        run: bun run globalyze run

      - name: Commit Globalyze updates
        run: |
          git config user.name "globalyze bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "globalyze bot: add missing translations"

      - name: Push Globalyze updates
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        run: git push origin "HEAD:${{ github.head_ref }}"

      - name: Scan for hardcoded UI strings
        run: bun run globalyze scan --fail-on-findings

      - name: Check locale coverage
        run: bun run globalyze translate --check

      - name: Note fork limitation
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          echo "Globalyze auto-fix generated changes, but this workflow cannot push to forked pull requests."
          echo "Re-run Globalyze locally or from a branch in the main repository to apply fixes automatically."
