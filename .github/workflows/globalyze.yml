name: Globalyze

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  i18n:
    runs-on: ubuntu-latest
    env:
      GLOBALYZE_INSTALL_SOURCE: ${{ vars.GLOBALYZE_INSTALL_SOURCE }}
      OPENAI_API_KEY: ${{ secrets.GLOBALYZE_OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GLOBALYZE_GEMINI_API_KEY }}
      LINGO_API_KEY: ${{ secrets.GLOBALYZE_LINGO_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Globalyze install source
        id: globalyze-source
        shell: bash
        run: |
          if [[ -f package.json ]] && grep -q '"name":[[:space:]]*"globalyze"' package.json; then
            echo "source=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${GLOBALYZE_INSTALL_SOURCE}" ]]; then
            echo "source=${GLOBALYZE_INSTALL_SOURCE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Repository variable GLOBALYZE_INSTALL_SOURCE is required for external repositories." >&2
          echo "Example: github:<owner>/globalyze" >&2
          exit 1

      - name: Install Globalyze CLI
        run: bun add -g "${{ steps.globalyze-source.outputs.source }}"

      - name: Verify Globalyze install
        run: globalyze --help

      - name: Sync project translations
        run: globalyze sync

      - name: Commit Globalyze updates
        run: |
          git config user.name "globalyze bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "globalyze bot: add missing translations"

      - name: Push Globalyze updates
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        run: git push origin "HEAD:${{ github.head_ref }}"

      - name: Scan for hardcoded UI strings
        run: globalyze scan --fail-on-findings

      - name: Check locale coverage
        run: globalyze sync --check

      - name: Note fork limitation
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          echo "Globalyze auto-fix generated changes, but this workflow cannot push to forked pull requests."
          echo "Re-run Globalyze locally or from a branch in the main repository to apply fixes automatically."
